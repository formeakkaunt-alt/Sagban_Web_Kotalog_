<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаблон: Оч фондаги фотосурат — «Варёная колбаса»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FAF7F2',
              100: '#F4ECE2',
              200: '#EADCCE',
              300: '#DECAB7',
            },
            burgundy: {
              700: '#5C1A24',
              800: '#48131B',
              900: '#380E15',
            },
            ink: {
              900: '#261619',
              700: '#4D3337',
              500: '#7A5B60',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-cream-50 text-ink-900 font-sans antialiased relative overflow-x-hidden">

  <!-- Light Atmospheric Background Photo -->
  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
    <img 
      id="bgImage"
      src="/images/incoming/sagban-doktorskaya-s-kopcheniem.jpg" 
      alt="Background" 
      class="w-full h-full object-cover object-center opacity-25 filter blur-[0.5px] scale-105 transition-opacity duration-300"
    />
    <!-- Light cream soft overlay to blend naturally -->
    <div class="absolute inset-0 bg-gradient-to-b from-cream-50/70 via-cream-50/40 to-cream-50/80"></div>
  </div>

  <!-- Content Layer -->
  <div class="relative z-10 min-h-screen flex flex-col">
    
    <!-- Top Interactive Controls Bar -->
    <div class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-cream-300 py-2.5 px-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-xs font-semibold text-burgundy-900">
        <span class="w-2 h-2 rounded-full bg-burgundy-700 animate-pulse"></span>
        <span>ШАБЛОН: Оч фондаги фотосурат намунаси (Асосий сайт ўзгармаган)</span>
      </div>

      <!-- Quick Opacity Controller -->
      <div class="flex items-center gap-2 text-xs">
        <span class="text-ink-500 font-medium">Фон тўқлиги:</span>
        <button onclick="setOpacity('0.15')" class="px-2.5 py-1 rounded-lg border border-cream-300 bg-white hover:bg-cream-100 text-xs font-semibold">15% (Жуда оч)</button>
        <button onclick="setOpacity('0.25')" class="px-2.5 py-1 rounded-lg border border-burgundy-700 bg-burgundy-700 text-white text-xs font-semibold">25% (Оптимал)</button>
        <button onclick="setOpacity('0.40')" class="px-2.5 py-1 rounded-lg border border-cream-300 bg-white hover:bg-cream-100 text-xs font-semibold">40% (Аниқроқ)</button>
        <button onclick="setOpacity('0.60')" class="px-2.5 py-1 rounded-lg border border-cream-300 bg-white hover:bg-cream-100 text-xs font-semibold">60% (Тўқроқ)</button>
      </div>
    </div>

    <!-- Header (Original Design) -->
    <header class="w-full bg-cream-50/85 backdrop-blur-md border-b border-cream-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <div class="flex flex-col">
          <span class="font-serif text-2xl sm:text-3xl font-bold tracking-[0.2em] text-burgundy-900">
            SAGBAN
          </span>
          <span class="text-[10px] tracking-[0.25em] uppercase text-ink-500 font-medium -mt-1">
            Торговая марка
          </span>
        </div>

        <div class="px-5 py-2 rounded-full border border-burgundy-700/30 bg-white/90 text-burgundy-900 text-xs font-semibold uppercase tracking-wider">
          • СЕРТИФИКАТ →
        </div>
      </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-1">
      
      <!-- Top Navigation & Breadcrumbs -->
      <div class="flex items-center justify-between mb-8 pb-6 border-b border-cream-200/80">
        <div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-white border border-cream-300 text-xs sm:text-sm font-semibold tracking-wider text-burgundy-900 shadow-sm cursor-pointer hover:bg-burgundy-800 hover:text-white transition-all">
          ← Назад
        </div>

        <div class="text-xs uppercase tracking-[0.2em] text-ink-500 font-medium">
          SAGBAN каталог / <span class="text-burgundy-800 font-semibold">Варёная колбаса</span>
        </div>
      </div>

      <!-- Category Title -->
      <div class="text-center max-w-2xl mx-auto mb-10 sm:mb-14">
        <h1 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-bold text-burgundy-900 mb-3 tracking-tight">
          Варёная колбаса
        </h1>
        <div class="w-10 h-0.5 bg-burgundy-700/60 mx-auto"></div>
      </div>

      <!-- Products Grid (14 real products) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
        
        <!-- 1. Mortadella -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/mortadella-bologna-s-fistashkami-900g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

        <!-- 2. Vetchina -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/vetchina-govyazhya-600g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

        <!-- 3. Doktorskaya oshpaz -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/doktorskaya-oshpaz-ms-500-700g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

        <!-- 4. Maxsus -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/maxsus-govyazhya-ms-500-700g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

        <!-- 5. Doktorskaya osobaya -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/doktorskaya-osobaya-ms-700g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

        <!-- 6. Doktorskaya d80 -->
        <div class="group bg-white rounded-3xl border border-cream-200/90 p-4 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
          <div class="aspect-square w-full rounded-2xl bg-cream-50/50 flex items-center justify-center p-3 border border-cream-100">
            <img src="/images/products/varenaya-kolbasa/doktorskaya-ms-d80-700g.jpg" alt="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
          </div>
        </div>

      </div>

    </main>

  </div>

  <script>
    function setOpacity(val) {
      document.getElementById('bgImage').style.opacity = val;
    }
  </script>

</body>
</html>
